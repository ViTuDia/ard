<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>ARD — Gereedschap</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <link rel="stylesheet" href="shared/theme.css">
  <script src="shared/firebase.js"></script>
  <script src="shared/theme.js"></script>
  <script src="shared/helpers.js"></script>
  <style>
    #app { display: none; flex-direction: column; min-height: 100vh; }
    .router-body { flex: 1; padding: 40px 24px; }
    .router-inner { max-width: 760px; margin: 0 auto; }
    .router-intro { font-size: 13px; color: var(--txtSecondary); font-weight: 300; margin-bottom: 24px; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
    .tile {
      display: block; padding: 20px; border-radius: 6px; text-decoration: none;
      background: var(--kaart); border: 1px solid var(--kaartBorder); color: var(--txtPrimary);
      transition: border-color 0.15s, transform 0.15s;
    }
    .tile:hover { border-color: var(--geel); transform: translateY(-2px); }
    .tile-naam { font-size: 17px; font-weight: 500; }
    .tile-naam .slash { color: var(--geel); margin-right: 6px; }
    .tile-oms { font-size: 12px; color: var(--txtSecondary); font-weight: 300; margin-top: 6px; }
  </style>
</head>
<body>
  <!-- Inlogscherm: de enige plek in de repo waar wordt ingelogd -->
  <div id="login-screen">
    <div class="logo">
      <div class="logo-ard">ARD</div>
      <div class="logo-sub">ATELIERRUIMDENKERS</div>
    </div>
    <div id="login-mode" style="display:none;flex-direction:column;align-items:center">
      <input type="email" id="login-email" name="email" autocomplete="username" placeholder="E-mailadres" style="margin-bottom:6px" onfocus="this.placeholder=''" onblur="if(!this.value)this.placeholder='E-mailadres'" autofocus>
      <input type="password" id="login-pw" name="password" autocomplete="current-password" placeholder="Wachtwoord" onfocus="this.placeholder=''" onblur="if(!this.value)this.placeholder='Wachtwoord'">
      <button onclick="handleLogin()">Inloggen</button>
      <div id="login-error"></div>
    </div>
    <div id="login-loading" style="display:flex;flex-direction:column;align-items:center">
      <div style="color:#ffffff44;font-size:12px">Laden...</div>
    </div>
  </div>

  <!-- App-keuze -->
  <div id="app">
    <div id="shell"></div>
    <div class="router-body">
      <div class="router-inner">
        <div class="router-intro">Alle apps delen dezelfde login en database.</div>
        <div class="tiles" id="tiles"></div>
      </div>
    </div>
    <div class="footer">
      <span>ARD <span style="color:var(--geel)">/</span> AtelierRuimDenkers</span>
      <span id="user-mail"></span>
    </div>
  </div>
  <div id="modal-container"></div>

  <script>
// ════════════════════════════════════════════════════
// ARD — router: inloggen, app-keuze en accountbeheer
// ════════════════════════════════════════════════════

const R_STATE = {
  dark: themeIsDark(),
  headerMenu: false,
  modal: null,          // null of 'password'
  pw: { oud:'', nieuw:'', nieuw2:'', msg:'', ok:false }
};

function C() { return themePalette(R_STATE.dark); }
function applyTheme() { applyPalette(C()); }

// ─── Inloggen ───────────────────────────────────
function showPanel(id) {
  ['login-mode','login-loading'].forEach(i => {
    const el = document.getElementById(i);
    if (el) el.style.display = 'none';
  });
  const el = document.getElementById(id);
  el.style.display = 'flex';
  el.style.flexDirection = 'column';
  el.style.alignItems = 'center';
}

function showLogin(msg) {
  showPanel('login-mode');
  const errEl = document.getElementById('login-error');
  errEl.style.color = '';
  errEl.textContent = msg || '';
  const emailEl = document.getElementById('login-email');
  if (emailEl && !emailEl.value) emailEl.focus();
  else document.getElementById('login-pw').focus();
}

async function handleLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pw = document.getElementById('login-pw').value;
  const errEl = document.getElementById('login-error');
  if (!email) { errEl.style.color = ''; errEl.textContent = 'Voer je e-mailadres in.'; return; }
  if (!pw) { errEl.style.color = ''; errEl.textContent = 'Voer een wachtwoord in.'; return; }
  errEl.style.color = '#d9a300';
  errEl.textContent = 'Bezig...';
  try {
    if (!auth) initFirebase();
    await auth.signInWithEmailAndPassword(email, pw);
    // onAuthStateChanged pakt het op en toont de app-keuze
    errEl.textContent = '';
  } catch(e) {
    errEl.style.color = '';
    errEl.textContent = authErrorText(e);
  }
}

// ─── Rendering ──────────────────────────────────
function render() {
  const c = C();
  // Geen 'Alle apps' en geen printknop: je bent hier al, en er valt niets te printen
  document.getElementById('shell').innerHTML = `<div class="header">
    ${renderBrand('GEREEDSCHAP', 'Kies een app', { home: false })}
    <div class="header-right">
      ${renderHeaderMenu({ dark: R_STATE.dark, menuOpen: R_STATE.headerMenu, c, home: false, print: false,
        extra: [{action:'showPassword',icon:ico('lock',16),label:'Wachtwoord wijzigen'}] })}
    </div>
  </div>`;
  document.getElementById('tiles').innerHTML = ARD_APPS.map(a =>
    `<a class="tile" href="${a.file}">
       <div class="tile-naam"><span class="slash">/</span>${esc(a.naam)}</div>
       <div class="tile-oms">${esc(a.omschrijving)}</div>
     </a>`
  ).join('');
  renderModal();
}

function renderModal() {
  const wrap = document.getElementById('modal-container');
  if (R_STATE.modal !== 'password') { wrap.innerHTML = ''; return; }
  const c = C(), p = R_STATE.pw;
  // Geen stopPropagation op de modal: de klik-afhandeling loopt via delegatie
  // op document, en die zou daarmee geblokkeerd worden. Sluiten gebeurt alleen
  // als de klik precies de overlay raakt (data-overlay), niet een kind ervan.
  wrap.innerHTML = `<div class="modal-overlay" data-overlay="1">
    <div class="modal" style="max-width:420px">
      <div class="modal-head">
        <h3>Wachtwoord wijzigen</h3>
        <button class="btn-icon" data-action="closeModal" style="font-size:18px">&times;</button>
      </div>
      <div class="modal-body">
        <div class="field"><label>Huidig</label><input type="password" autocomplete="current-password" value="${esc(p.oud)}" oninput="R.pwField('oud',this.value)"></div>
        <div class="field"><label>Nieuw</label><input type="password" autocomplete="new-password" value="${esc(p.nieuw)}" oninput="R.pwField('nieuw',this.value)"></div>
        <div class="field"><label>Herhaal nieuw</label><input type="password" autocomplete="new-password" value="${esc(p.nieuw2)}" oninput="R.pwField('nieuw2',this.value)"></div>
        ${p.msg ? `<div style="font-size:11px;margin-bottom:8px;color:${p.ok?c.groen:c.rood}">${esc(p.msg)}</div>` : ''}
        <button class="btn btn-black btn-sm" style="margin-top:4px" data-action="changePassword">Wijzig wachtwoord</button>
      </div>
    </div>
  </div>`;
}

// Waarde bijhouden zonder opnieuw te tekenen, anders springt de cursor weg
const R = {
  pwField(key, val) { R_STATE.pw[key] = val; }
};

function showApps(user) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('user-mail').textContent = user.email || '';
  applyTheme();
  render();
}

// ─── Wachtwoord wijzigen ────────────────────────
async function changePassword() {
  const p = R_STATE.pw;
  if (!p.oud) { p.msg = 'Voer huidig wachtwoord in.'; p.ok = false; renderModal(); return; }
  if (!p.nieuw || p.nieuw.length < 8) { p.msg = 'Nieuw wachtwoord: minimaal 8 tekens.'; p.ok = false; renderModal(); return; }
  if (p.nieuw !== p.nieuw2) { p.msg = 'Nieuwe wachtwoorden komen niet overeen.'; p.ok = false; renderModal(); return; }
  try {
    const user = auth && auth.currentUser;
    if (!user) { p.msg = 'Je bent niet meer ingelogd. Herlaad de pagina.'; p.ok = false; renderModal(); return; }
    // Firebase eist een recente login voordat het wachtwoord mag wijzigen
    const cred = firebase.auth.EmailAuthProvider.credential(user.email, p.oud);
    await user.reauthenticateWithCredential(cred);
    await user.updatePassword(p.nieuw);
    p.msg = 'Wachtwoord gewijzigd!'; p.ok = true;
    p.oud = ''; p.nieuw = ''; p.nieuw2 = '';
    renderModal();
  } catch(err) {
    const wrong = err && (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential');
    p.msg = wrong ? 'Huidig wachtwoord is onjuist.' : authErrorText(err);
    p.ok = false; renderModal();
  }
}

function setupEventListeners() {
  document.addEventListener('click', e => {
    // Klik naast de modal (op de overlay zelf) sluit hem
    if (e.target.dataset && e.target.dataset.overlay) {
      R_STATE.modal = null; renderModal(); return;
    }

    const el = e.target.closest('[data-action]');
    const action = el ? el.dataset.action : null;

    // Klik buiten het menu sluit het
    if (R_STATE.headerMenu && action !== 'toggleHeaderMenu') { R_STATE.headerMenu = false; render(); }
    if (!action) return;

    switch(action) {
      case 'toggleHeaderMenu':
        R_STATE.headerMenu = !R_STATE.headerMenu; render(); break;
      case 'toggleDark':
        R_STATE.dark = !R_STATE.dark; R_STATE.headerMenu = false;
        themeSetDark(R_STATE.dark); applyTheme(); render(); break;
      case 'showPassword':
        R_STATE.headerMenu = false;
        R_STATE.pw = { oud:'', nieuw:'', nieuw2:'', msg:'', ok:false };
        R_STATE.modal = 'password'; render(); break;
      case 'closeModal':
        R_STATE.modal = null; renderModal(); break;
      case 'changePassword':
        changePassword(); break;
      case 'logout':
        logout(); break;
    }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && R_STATE.modal) { R_STATE.modal = null; renderModal(); }
  });
}

(function init() {
  initFirebase();

  // Opruimen: restanten van de oude client-side login
  localStorage.removeItem('kb_session');
  localStorage.removeItem('kb_hash');

  if (!auth) {
    showLogin('Kan Firebase niet initialiseren. Herlaad de pagina.');
    return;
  }

  auth.onAuthStateChanged(user => {
    if (user) showApps(user);
    else {
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('app').style.display = 'none';
      showLogin();
    }
  });

  ['login-email','login-pw'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') handleLogin();
    });
  });
  setupEventListeners();
})();
  </script>
</body>
</html>
