<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>ARD — Gereedschap</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <link rel="stylesheet" href="shared/theme.css?v=5">
  <script src="shared/firebase.js?v=5"></script>
  <script src="shared/theme.js?v=5"></script>
  <script src="shared/helpers.js?v=5"></script>
  <style>
    #app { display: none; flex-direction: column; min-height: 100vh; }
    /* Het blok staat verticaal gecentreerd, zodat een breed scherm niet
       onderaan half leeg blijft. */
    .router-body { flex: 1; display: flex; align-items: center; padding: 40px 24px; }
    /* Eén kolom, breed, en meeschalend: de tegels vullen de beschikbare
       breedte tot 960px en krimpen daaronder mee met het venster. */
    .router-inner { width: 100%; max-width: 960px; margin: 0 auto; }
    .tiles { display: flex; flex-direction: column; gap: 14px; }

    /* Een rij van icoon — tekst — pijl, zodat de volle breedte iets doet
       in plaats van leeg te blijven naast de tekst. */
    .tile {
      display: flex; align-items: center; gap: 22px;
      width: 100%; padding: 24px 28px; border-radius: 6px; text-decoration: none;
      background: var(--kaart); border: 1px solid var(--kaartBorder); color: var(--txtPrimary);
      transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
    }
    .tile:hover {
      border-color: var(--geel); transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }
    .tile-icon {
      flex-shrink: 0; width: 52px; height: 52px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(217,163,0,0.1); color: var(--geel);
      transition: background 0.15s;
    }
    .tile:hover .tile-icon { background: var(--geel); color: #000; }
    .tile-tekst { flex: 1; min-width: 0; }
    .tile-naam { font-size: 19px; font-weight: 500; }
    .tile-naam .slash { color: var(--geel); margin-right: 6px; }
    .tile-oms { font-size: 13px; color: var(--txtSecondary); font-weight: 300; margin-top: 4px; }
    .tile-pijl {
      flex-shrink: 0; color: var(--zachtgrijs);
      transition: color 0.15s, transform 0.15s;
    }
    .tile:hover .tile-pijl { color: var(--geel); transform: translateX(4px); }

    @media (max-width: 767px) {
      .router-body { padding: 20px 14px; align-items: flex-start; }
      .tile { padding: 16px; gap: 14px; }
      .tile-icon { width: 42px; height: 42px; }
      .tile-naam { font-size: 17px; }
      .tile-oms { font-size: 12px; }
      .tile-pijl { display: none; }
    }
  </style>
</head>
<body>
  <!-- Inlogscherm: de enige plek in de repo waar wordt ingelogd -->
  <div id="login-screen">
    <div class="logo">
      <div class="logo-ard">ARD</div>
      <div class="logo-sub">ATELIERRUIMDENKERS</div>
    </div>
    <div id="login-mode" style="display:none;flex-direction:column;align-items:center">
      <input type="email" id="login-email" name="email" autocomplete="username" placeholder="E-mailadres" style="margin-bottom:6px" onfocus="this.placeholder=''" onblur="if(!this.value)this.placeholder='E-mailadres'" autofocus>
      <input type="password" id="login-pw" name="password" autocomplete="current-password" placeholder="Wachtwoord" onfocus="this.placeholder=''" onblur="if(!this.value)this.placeholder='Wachtwoord'">
      <button onclick="handleLogin()">Inloggen</button>
      <div id="login-error"></div>
    </div>
    <div id="login-loading" style="display:flex;flex-direction:column;align-items:center">
      <div style="color:#ffffff44;font-size:12px">Laden...</div>
    </div>
  </div>

  <!-- App-keuze -->
  <div id="app">
    <div id="shell"></div>
    <div class="router-body">
      <div class="router-inner">
        <div class="tiles" id="tiles"></div>
      </div>
    </div>
    <div class="footer">
      <span>ARD <span style="color:var(--geel)">/</span> AtelierRuimDenkers</span>
      <span id="user-mail"></span>
    </div>
  </div>

  <script>
// ════════════════════════════════════════════════════
// ARD — router: inloggen en app-keuze
// Wachtwoord wijzigen zit hier bewust niet in: dat doet Vincent in de
// Firebase Console (Authentication → Users), met twee gebruikers geen gedoe waard.
// ════════════════════════════════════════════════════

const R_STATE = {
  dark: themeIsDark(),
  headerMenu: false
};

function C() { return themePalette(R_STATE.dark); }
function applyTheme() { applyPalette(C()); }

// ─── Inloggen ───────────────────────────────────
function showPanel(id) {
  ['login-mode','login-loading'].forEach(i => {
    const el = document.getElementById(i);
    if (el) el.style.display = 'none';
  });
  const el = document.getElementById(id);
  el.style.display = 'flex';
  el.style.flexDirection = 'column';
  el.style.alignItems = 'center';
}

function showLogin(msg) {
  showPanel('login-mode');
  const errEl = document.getElementById('login-error');
  errEl.style.color = '';
  errEl.textContent = msg || '';
  const emailEl = document.getElementById('login-email');
  if (emailEl && !emailEl.value) emailEl.focus();
  else document.getElementById('login-pw').focus();
}

async function handleLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pw = document.getElementById('login-pw').value;
  const errEl = document.getElementById('login-error');
  if (!email) { errEl.style.color = ''; errEl.textContent = 'Voer je e-mailadres in.'; return; }
  if (!pw) { errEl.style.color = ''; errEl.textContent = 'Voer een wachtwoord in.'; return; }
  errEl.style.color = '#d9a300';
  errEl.textContent = 'Bezig...';
  try {
    if (!auth) initFirebase();
    await auth.signInWithEmailAndPassword(email, pw);
    // onAuthStateChanged pakt het op en toont de app-keuze
    errEl.textContent = '';
  } catch(e) {
    errEl.style.color = '';
    errEl.textContent = authErrorText(e);
  }
}

// ─── Rendering ──────────────────────────────────
function render() {
  const c = C();
  // Geen 'Alle apps' en geen printknop: je bent hier al, en er valt niets te printen
  document.getElementById('shell').innerHTML = `<div class="header">
    ${renderBrand('GEREEDSCHAP', 'Kies een app', { home: false })}
    <div class="header-right">
      ${renderHeaderMenu({ dark: R_STATE.dark, menuOpen: R_STATE.headerMenu, c, home: false, print: false })}
    </div>
  </div>`;
  document.getElementById('tiles').innerHTML = ARD_APPS.map(a =>
    `<a class="tile" href="${a.file}">
       <div class="tile-icon">${ico(a.icon, 26)}</div>
       <div class="tile-tekst">
         <div class="tile-naam"><span class="slash">/</span>${esc(a.naam)}</div>
         <div class="tile-oms">${esc(a.omschrijving)}</div>
       </div>
       <div class="tile-pijl">${ico('arrowRight', 20)}</div>
     </a>`
  ).join('');
}

function showApps(user) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('user-mail').textContent = user.email || '';
  applyTheme();
  render();
}

function setupEventListeners() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    const action = el ? el.dataset.action : null;

    // Klik buiten het menu sluit het
    if (R_STATE.headerMenu && action !== 'toggleHeaderMenu') { R_STATE.headerMenu = false; render(); }
    if (!action) return;

    switch(action) {
      case 'toggleHeaderMenu':
        R_STATE.headerMenu = !R_STATE.headerMenu; render(); break;
      case 'toggleDark':
        R_STATE.dark = !R_STATE.dark; R_STATE.headerMenu = false;
        themeSetDark(R_STATE.dark); applyTheme(); render(); break;
      case 'logout':
        logout(); break;
    }
  });
}

(function init() {
  initFirebase();

  // Opruimen: restanten van de oude client-side login
  localStorage.removeItem('kb_session');
  localStorage.removeItem('kb_hash');

  if (!auth) {
    showLogin('Kan Firebase niet initialiseren. Herlaad de pagina.');
    return;
  }

  auth.onAuthStateChanged(user => {
    if (user) showApps(user);
    else {
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('app').style.display = 'none';
      showLogin();
    }
  });

  ['login-email','login-pw'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') handleLogin();
    });
  });
  setupEventListeners();
})();
  </script>
</body>
</html>
