<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Koers — ARD</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <link rel="stylesheet" href="shared/theme.css">
  <script src="shared/firebase.js"></script>
  <script src="shared/theme.js"></script>
  <script src="shared/helpers.js"></script>
  <script src="shared/koers-model.js"></script>
  <style>
    #app { display: none; flex-direction: column; min-height: 100vh; }
    .app-body { flex: 1; padding: 40px 24px; }
    .app-inner { max-width: 760px; margin: 0 auto; }
    .nog-leeg {
      padding: 40px 24px; text-align: center; border-radius: 6px;
      border: 2px dashed var(--zachtgrijs); color: var(--txtSecondary);
    }
    .nog-leeg h2 { font-size: 18px; font-weight: 500; color: var(--txtPrimary); margin-bottom: 8px; }
    .nog-leeg p { font-size: 13px; font-weight: 300; line-height: 1.6; }

    /* Voorlopig overzicht van de indeling; de roadmap zelf komt in fase 3 */
    .areas-lijst { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; }
    .area-kaart {
      background: var(--kaart); border: 1px solid var(--kaartBorder);
      border-radius: 6px; padding: 14px 18px;
    }
    .area-naam { font-size: 14px; font-weight: 500; }
    .area-naam .nr { color: var(--geel); margin-right: 8px; }
    .area-subs { font-size: 12px; color: var(--txtSecondary); font-weight: 300; margin-top: 8px; }
    .sub-regel { padding: 2px 0; }
    .sub-bullet { display: inline-block; width: 14px; color: var(--geel); }
    .status-regel { font-size: 12px; color: var(--txtSecondary); font-weight: 300; margin-top: 18px; }
  </style>
</head>
<body>
  <div id="app">
    <div id="shell"></div>
    <div class="app-body">
      <div class="app-inner">
        <div class="nog-leeg">
          <h2>De indeling staat</h2>
          <p>Dit zijn de gebieden waar je doelen straks onder hangen.<br>
             De roadmap zelf — balken, maanden, statussen — komt in de volgende fase.</p>
        </div>
        <div class="areas-lijst" id="areas-lijst"></div>
        <div class="status-regel" id="status-regel"></div>
      </div>
    </div>
    <div class="footer">
      <span>ARD <span style="color:var(--geel)">/</span> AtelierRuimDenkers</span>
      <span>Koers</span>
    </div>
    <div id="toast" class="toast"></div>
  </div>

  <script>
// ════════════════════════════════════════════════════
// KOERS — ARD / AtelierRuimDenkers
// Strategische kwartaaldoelen. Nu nog een schil; de inhoud volgt.
// ════════════════════════════════════════════════════

const KR = {};

const KR_STATE = {
  ui: { dark: themeIsDark(), headerMenu: false },
  data: { areas: {}, goals: {} }
};

function C() { return themePalette(KR_STATE.ui.dark); }
function applyTheme() { applyPalette(C()); }

function render() {
  document.getElementById('shell').innerHTML = renderAppShell({
    label: 'STRATEGIE', naam: 'Koers', appId: 'koers',
    dark: KR_STATE.ui.dark, menuOpen: KR_STATE.ui.headerMenu, c: C()
  });
}

function setupEventListeners() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    const action = el ? el.dataset.action : null;

    // Klik buiten het menu sluit het
    if (KR_STATE.ui.headerMenu && action !== 'toggleHeaderMenu') { KR_STATE.ui.headerMenu = false; render(); }
    if (!action) return;

    switch(action) {
      case 'toggleHeaderMenu':
        KR_STATE.ui.headerMenu = !KR_STATE.ui.headerMenu; render(); break;
      case 'toggleDark':
        KR_STATE.ui.dark = !KR_STATE.ui.dark; KR_STATE.ui.headerMenu = false;
        themeSetDark(KR_STATE.ui.dark);
        applyTheme(); render(); break;
      case 'print':
        KR_STATE.ui.headerMenu = false; render(); setTimeout(() => window.print(), 100); break;
      case 'gotoApps':
        window.location.href = 'index.html'; break;
      case 'logout':
        logout(); break;
    }
  });
}

// ─── Data ───────────────────────────────────────
// De indeling (areas + subgroepen) komt uit shared/koers-model.js en wordt
// weggeschreven zolang de opgeslagen versie achterloopt. Zo landt een
// bijgewerkte indeling vanzelf, zonder de database met de hand te legen.
//
// Let op: dit overschrijft /koers/areas. Dat mag nu, omdat de indeling van
// ons komt en Vincent hem nog niet zelf beheert. Zodra dat wel zo is
// (fase 6), moet dit eruit — anders gooit een versieverhoging zijn werk weg.
async function seedIndienNodig() {
  const [vlagSnap, versieSnap] = await Promise.all([
    db.ref('koers/settings/seeded').once('value'),
    db.ref('koers/settings/seedVersie').once('value')
  ]);
  // Een database van vóór de versietelling heeft alleen 'seeded: true' → versie 1
  const huidig = versieSnap.val() || (vlagSnap.val() === true ? 1 : 0);
  if (huidig >= KOERS_SEED_VERSIE) return false;

  await fbSet('koers/areas', KOERS_AREAS_DEFAULT);
  await fbUpdate('koers/settings', { seeded: true, seedVersie: KOERS_SEED_VERSIE });
  return huidig === 0 ? 'nieuw' : 'bijgewerkt';
}

function luisterNaarData() {
  db.ref('koers/areas').on('value', snap => {
    KR_STATE.data.areas = snap.val() || {};
    renderAreas();
  });
  db.ref('koers/goals').on('value', snap => {
    KR_STATE.data.goals = snap.val() || {};
    renderAreas();
  });
}

function renderAreas() {
  const areas = KR_STATE.data.areas;
  const ids = Object.keys(areas).sort((a, b) => (areas[a].order || 0) - (areas[b].order || 0));
  document.getElementById('areas-lijst').innerHTML = ids.map(id => {
    const a = areas[id];
    // Inspringen per niveau: met drie keer 'Ongoing' zegt een platte rij niets
    const regels = koersSubgroepen({ [id]: a }).map(sub =>
      `<div class="sub-regel" style="padding-left:${(sub.pad.length - 1) * 18}px">
         <span class="sub-bullet">${sub.leaf ? '\u00B7' : '\u25B8'}</span>${esc(sub.name)}
       </div>`).join('');
    return `<div class="area-kaart">
      <div class="area-naam"><span class="nr">${a.order || ''}</span>${esc(a.name)}</div>
      <div class="area-subs">${regels || 'geen subgroepen'}</div>
    </div>`;
  }).join('');

  const aantalDoelen = Object.keys(KR_STATE.data.goals).length;
  const bladeren = koersLeafSubgroepen(areas).length;
  document.getElementById('status-regel').textContent =
    `${ids.length} gebieden, ${bladeren} subgroepen waar doelen aan kunnen hangen, ` +
    `${aantalDoelen} ${aantalDoelen === 1 ? 'doel' : 'doelen'}.`;
}

(function init() {
  requireAuth(async () => {
    document.getElementById('app').style.display = 'flex';
    applyTheme();
    render();
    setupEventListeners();

    try {
      const geseed = await seedIndienNodig();
      if (geseed === 'nieuw') showToast('Indeling aangemaakt');
      else if (geseed === 'bijgewerkt') showToast('Indeling bijgewerkt');
      luisterNaarData();
    } catch (e) {
      console.error('Koers-data:', e);
      const uitleg = (e && e.code === 'PERMISSION_DENIED')
        ? 'Geen toegang tot /koers. Staat de koers-regel al in de Firebase-rules?'
        : 'Kon de indeling niet laden: ' + (e.message || e);
      document.getElementById('status-regel').textContent = uitleg;
    }
  });
})();
  </script>
</body>
</html>
