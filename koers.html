<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Koers — ARD</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <link rel="stylesheet" href="shared/theme.css?v=3">
  <script src="shared/firebase.js?v=3"></script>
  <script src="shared/theme.js?v=3"></script>
  <script src="shared/helpers.js?v=3"></script>
  <script src="shared/koers-model.js?v=3"></script>
  <style>
    /* ─── Schil ──────────────────────────────────────
       Alleen het raster scrollt; toolbar, legenda en footer staan stil. */
    #app { display: none; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }

    #kr-melding { display: none; padding: 10px 24px; font-size: 12px; font-weight: 300; color: var(--rood);
                  background: var(--catHeaderBg); border-bottom: 1px solid var(--kaartBorder); }
    #kr-melding.zicht { display: block; }

    .kr-toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 24px;
                  background: var(--panelBg); border-bottom: 1px solid var(--kaartBorder); }
    .kr-toolbar .btn { white-space: nowrap; }
    .kr-toolbar-stat { margin-left: auto; font-size: 11px; font-weight: 300; color: var(--txtSecondary);
                       text-align: right; }

    /* ─── Het raster ─────────────────────────────────
       Eén scroll-container met één grid erin: de linkerkolom en de drie
       koprijen zijn sticky. Links en rechts zitten per rij in dezelfde
       grid-row, dus uitlijnen kan niet fout gaan. De maanden zijn de
       grid-kolommen — er wordt nergens met pixels gerekend om iets te
       plaatsen. Maten staan als variabelen in CSS (ook voor mobiel en
       print); JS leest ze met krMaten() en zet ze nooit. */
    #kr-scroll { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; background: var(--bg); }
    #kr-grid {
      --kr-left: 230px; --kr-col: 34px; --kr-bar: 20px; --kr-pad: 6px; --kr-gap: 4px;
      --kr-h1: 22px; --kr-h2: 20px; --kr-h3: 18px; --kr-rowarea: 24px; --kr-rowsub: 26px;
      display: grid; position: relative; width: max-content; min-width: 100%;
    }

    /* Koprijen: jaar, kwartaal, maand. De hoekcel staat in beide richtingen vast. */
    .kr-hoek, .kr-jaar, .kr-kw, .kr-mnd { background: var(--panelBg); display: flex; align-items: center; }
    .kr-hoek { grid-row: 1 / span 3; grid-column: 1; position: sticky; left: 0; top: 0; z-index: 7;
               padding: 0 10px; font-size: 9px; font-weight: 500; letter-spacing: 1.5px;
               text-transform: uppercase; color: var(--txtSecondary);
               border-right: 1px solid var(--kaartBorder); border-bottom: 1px solid var(--zachtgrijs); }
    .kr-jaar { position: sticky; top: 0; z-index: 6; justify-content: center;
               font-size: 11px; font-weight: 500; letter-spacing: 2px; }
    /* Het jaartal staat gecentreerd, maar blijft plakken zodra het jaar half
       uit beeld scrollt — anders weet je bij meerdere jaren niet waar je bent. */
    .kr-jaar span { position: sticky; left: calc(var(--kr-left) + 8px); }
    .kr-kw   { position: sticky; top: var(--kr-h1); z-index: 6; justify-content: center;
               font-size: 9px; font-weight: 400; color: var(--txtSecondary);
               border-right: 1px solid var(--zachtgrijs); }
    .kr-mnd  { position: sticky; top: calc(var(--kr-h1) + var(--kr-h2)); z-index: 6; justify-content: center;
               font-size: 9px; font-weight: 300; color: var(--txtSecondary);
               border-bottom: 1px solid var(--zachtgrijs); }
    .kr-jgrens { border-left: 2px solid var(--zachtgrijs); }
    .kr-mnd.kr-nu { color: var(--rood); font-weight: 500; border-bottom: 2px solid var(--rood); }

    /* Linkerkolom */
    .kr-l { grid-column: 1; position: sticky; left: 0; z-index: 5; display: flex; align-items: center;
            gap: 6px; padding: 0 10px; overflow: hidden; background: var(--panelBg);
            border-right: 1px solid var(--kaartBorder); }
    .kr-l-area { background: var(--catHeaderBg); font-size: 10px; font-weight: 500; letter-spacing: .5px;
                 text-transform: uppercase; cursor: pointer; }
    .kr-l-area .nr { color: var(--geel); }
    .kr-l-sub { font-size: 11px; font-weight: 300; border-bottom: 1px solid var(--lichtgrijs); }
    .kr-l-sub.kr-tak { font-weight: 400; color: var(--txtSecondary); }
    .kr-l-naam { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Rij-achtergrond met de rasterlijnen. Twee gradients in plaats van een
       cel per maand, dus het hele grid blijft klein. */
    .kr-rij { grid-column: 2 / -1; border-bottom: 1px solid var(--lichtgrijs);
      background-image:
        repeating-linear-gradient(to right, transparent 0, transparent calc(var(--kr-col) * 3 - 1px), var(--zachtgrijs) calc(var(--kr-col) * 3 - 1px), var(--zachtgrijs) calc(var(--kr-col) * 3)),
        repeating-linear-gradient(to right, transparent 0, transparent calc(var(--kr-col) - 1px), var(--lichtgrijs) calc(var(--kr-col) - 1px), var(--lichtgrijs) var(--kr-col));
    }
    /* Dezelfde lijnen met de grijstint uit het palet gemengd — kwartaal
       sterker dan maand. Kan een browser geen color-mix, dan blijft de
       regel hierboven staan. */
    @supports (background: color-mix(in srgb, red 50%, transparent)) {
      .kr-rij {
        background-image:
          repeating-linear-gradient(to right, transparent 0, transparent calc(var(--kr-col) * 3 - 1px), color-mix(in srgb, var(--grijs) 50%, transparent) calc(var(--kr-col) * 3 - 1px), color-mix(in srgb, var(--grijs) 50%, transparent) calc(var(--kr-col) * 3)),
          repeating-linear-gradient(to right, transparent 0, transparent calc(var(--kr-col) - 1px), color-mix(in srgb, var(--grijs) 20%, transparent) calc(var(--kr-col) - 1px), color-mix(in srgb, var(--grijs) 20%, transparent) var(--kr-col));
      }
    }
    .kr-rij-area { background-color: var(--catHeaderBg); background-image: none; cursor: pointer; }
    .kr-rij[data-sg] { cursor: cell; }
    .kr-grens { border-top: 2px solid var(--zachtgrijs); }

    /* Balken en stempels. Alles wat hier staat komt uit koersCellen(). */
    .kr-bar { border-radius: 3px; font-size: 10px; line-height: 1; display: flex; align-items: center;
              padding: 0 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
              cursor: pointer; z-index: 1; }
    /* In een flexbalk knipt text-overflow niet; de tekst heeft een eigen span nodig */
    .kr-lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .kr-groen { background: var(--groen); color: var(--wit, #fff); }
    .kr-half { border-radius: 3px 0 0 3px; }
    /* Doorlopend loopt per kwartaal: losse blokken met een naad ertussen,
       geen balk die naar het niets vervaagt. */
    .kr-door { background: var(--geel); color: var(--zwart, #000); margin-right: 3px; }
    .kr-stempel { border: 1px solid rgba(0,0,0,.25); }
    .kr-k-geel { background: var(--geel); }
    .kr-k-oranje { background: var(--oranje); }
    .kr-k-roze { background: var(--roze); }
    /* Verlaten doelmaand: gestreept en doorgestreept. De cel is meestal leeg,
       dus de doorhaling is een pseudo-element en geen text-decoration. */
    .kr-verlaten, .kr-k-grijs { border: 1px solid var(--grijs); border-radius: 3px;
      background-image: repeating-linear-gradient(45deg, var(--grijs) 0 1px, transparent 1px 5px); }
    .kr-verlaten { position: relative; z-index: 1; }
    .kr-verlaten::after { content: ''; position: absolute; left: 2px; right: 2px; top: 50%;
                          border-top: 1px solid var(--grijs); }
    /* Prioriteit vóór kr-open, zodat de rode alarmrand het overneemt */
    .kr-prio { border: 2px solid var(--txtPrimary); font-weight: 500; }
    .kr-open { border: 2px solid var(--rood); }
    .kr-pijl { align-self: start; display: flex; align-items: center; justify-content: center;
               color: var(--txtPrimary); pointer-events: none; z-index: 1; }
    /* Titel buiten de balk: in een stempel van één maand past geen tekst.
       pointer-events uit, zodat de cellen eronder bruikbaar blijven. */
    .kr-titel { align-self: start; display: flex; align-items: center; padding-left: 5px;
                font-size: 10px; font-weight: 300; color: var(--txtSecondary);
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
                pointer-events: none; z-index: 1; }
    .kr-rollup { align-self: center; height: 16px; display: flex; align-items: center; gap: 4px;
                 padding: 0 6px; border: 1px solid var(--grijs); border-radius: 3px;
                 font-size: 9px; font-style: italic; color: var(--txtSecondary); z-index: 1;
                 background-image: repeating-linear-gradient(45deg, var(--grijs) 0 1px, transparent 1px 6px); }
    .kr-nu-lijn { position: absolute; width: 2px; background: var(--rood); z-index: 3; pointer-events: none; }
    .kr-leeg { grid-column: 2 / -1; display: flex; align-items: center; padding: 0 14px;
               font-size: 11px; font-weight: 300; color: var(--txtSecondary); }

    /* ─── Legenda ────────────────────────────────────
       Gegenereerd uit KOERS_STATUS, dus nooit te hardcoden. */
    #kr-legenda { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 8px 24px;
                  background: var(--panelBg); border-top: 1px solid var(--kaartBorder);
                  font-size: 10px; font-weight: 300; color: var(--txtSecondary); }
    .kr-leg { display: flex; align-items: center; gap: 5px; }
    .kr-swatch { width: 16px; height: 10px; border-radius: 2px; flex-shrink: 0; }
    /* Twee blokjes, want dat is precies wat doorlopend in het raster doet */
    .kr-swatch.kr-door { margin-right: 0;
      background: linear-gradient(to right, var(--geel) 0 44%, transparent 44% 56%, var(--geel) 56% 100%); }

    /* ─── Modals ─────────────────────────────────────
       theme.css levert .modal, .field, .cb en de knoppen; dit is wat Koers
       er zelf bij nodig heeft. */
    .kr-veldrij { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .kr-hint { font-size: 11px; font-weight: 300; line-height: 1.5; color: var(--txtSecondary);
               margin: -6px 0 12px; }
    .kr-cb-rij { display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
                 font-size: 12px; cursor: pointer; }
    .kr-bes { width: 100%; border-collapse: collapse; font-size: 12px; }
    .kr-bes th { text-align: left; padding: 0 6px 6px 0; font-size: 10px; font-weight: 500;
                 letter-spacing: .5px; text-transform: uppercase; color: var(--txtSecondary); }
    .kr-bes td { padding: 7px 6px 7px 0; border-top: 1px solid var(--lichtgrijs); vertical-align: middle; }
    .kr-bes select { padding: 4px 6px; font-size: 11px; font-family: inherit; border-radius: 4px;
                     border: 1px solid var(--inputBorder); background: var(--modalBg); color: var(--txtPrimary); }
    .kr-bes .kr-pad { font-size: 10px; font-weight: 300; color: var(--txtSecondary); }
    .kr-bes-knoppen { white-space: nowrap; text-align: right; }
    .kr-bes-knoppen .btn { margin-left: 4px; }

    /* ─── Mobiel ─────────────────────────────────── */
    @media (max-width: 767px) {
      #kr-grid { --kr-left: 124px; --kr-col: 26px; --kr-bar: 18px; --kr-pad: 5px; --kr-gap: 3px;
                 --kr-h1: 18px; --kr-h2: 16px; --kr-h3: 16px; --kr-rowarea: 22px; --kr-rowsub: 24px; }
      .kr-toolbar { padding: 6px 12px; }
      #kr-legenda { padding: 6px 12px; gap: 10px; font-size: 9px; }
      #kr-melding { padding: 8px 12px; }
      /* Op een telefoon blijft alleen het icoon van de headerknoppen over */
      .kr-btn-lang { display: none; }
      .kr-veldrij { grid-template-columns: 1fr; gap: 0; }
      .kr-bes-knoppen { text-align: left; }
      .kr-bes-knoppen .btn { margin: 2px 4px 2px 0; }
    }

    /* ─── Print ──────────────────────────────────── */
    @page { size: landscape; margin: 0; }
    @media print {
      html, body, #app { height: auto !important; overflow: visible !important; }
      body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      #kr-scroll { overflow: visible !important; flex: none !important; }
      #kr-grid { --kr-left: 200px; --kr-col: 24px; }
      /* sticky en printen is gokken; in print staat alles gewoon stil */
      .kr-hoek, .kr-jaar, .kr-kw, .kr-mnd, .kr-l { position: static !important; }
      .kr-toolbar { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="shell"></div>
    <div id="kr-melding"></div>
    <div id="kr-scroll"><div id="kr-grid"></div></div>
    <div id="kr-legenda"></div>
    <div class="footer">
      <span>ARD <span style="color:var(--geel)">/</span> AtelierRuimDenkers</span>
      <span>Koers</span>
    </div>
    <div id="kr-modal"></div>
    <div id="toast" class="toast"></div>
  </div>

  <script>
// ════════════════════════════════════════════════════
// KOERS — ARD / AtelierRuimDenkers
// Strategische kwartaaldoelen op een roadmap.
//
// De tekenregels staan NIET hier maar in shared/koers-model.js:
// koersCellen() zegt per doel welke cellen er zijn (groene aanloop, één
// stempel, een verlaten maand) en dit bestand zet dat om in grid-items.
// ════════════════════════════════════════════════════

const KR = {};

// Eén datum per sessie: elke render is consistent, en bij testen hoef je
// niet aan de systeemklok te zitten.
const KR_VANDAAG = new Date();
const KR_MND = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const KR_PIJL = '<svg width="14" height="14" viewBox="0 0 18 20" fill="currentColor"><path d="M2 4 L16 10 L2 16 Z"/></svg>';

const KR_STATE = {
  ui: {
    dark: themeIsDark(), headerMenu: false,
    collapsedAreas: {},
    naarVandaagGedaan: false,
    melding: '',
    // modalData is de edit-buffer: een kopie van het doel, of een vers doel
    // met isNew. Pas bij Klaar gaat het naar Firebase.
    modal: null, modalData: null, modalExtra: null, modalDirty: false
  },
  data: { areas: {}, goals: {}, settings: {} }
};

function C() { return themePalette(KR_STATE.ui.dark); }
function applyTheme() { applyPalette(C()); }

// ─── Maten ──────────────────────────────────────
// De stylesheet is de enige bron (ook voor mobiel en print); hier lezen we
// alleen. Zo klopt het rekenwerk ook na een rotatie.
function krMaten() {
  const s = getComputedStyle(document.getElementById('kr-grid'));
  const p = k => parseInt(s.getPropertyValue('--kr-' + k), 10) || 0;
  return { left:p('left'), col:p('col'), bar:p('bar'), pad:p('pad'), gap:p('gap'),
           h1:p('h1'), h2:p('h2'), h3:p('h3'), rowarea:p('rowarea'), rowsub:p('rowsub') };
}

// ─── De tijdas ──────────────────────────────────
// Hele jaren, zodat de kwartaalkoppen kloppen. Altijd dit jaar én volgend
// jaar: je kunt niet plannen in een jaar dat niet getekend is. completedAt
// telt mee, want een oranje stempel kan buiten [start,eind] vallen.
function krAs() {
  const nu = maandNr(huidigeMaand(KR_VANDAAG));
  const jNu = Math.floor(nu / 12);
  let min = jNu, max = jNu + 1;
  objToArr(KR_STATE.data.goals).forEach(g => {
    [g.startMonth, g.endMonth, g.completedAt].forEach(m => {
      const nr = maandNr(m);
      if (nr == null) return;
      const j = Math.floor(nr / 12);
      if (j < min) min = j;
      if (j > max) max = j;
    });
  });
  const van = min * 12, tot = max * 12 + 11;
  return { van, tot, n: tot - van + 1, nu };
}

// ─── Rijen ──────────────────────────────────────
// Één platte lijst voor links én rechts. Een ingeklapt gebied levert geen
// subgroeprijen; daar komt in plaats daarvan een samenvatbalk.
function krRijen() {
  const areas = KR_STATE.data.areas;
  const rijen = [];
  Object.keys(areas)
    .sort((a, b) => (areas[a].order || 0) - (areas[b].order || 0))
    .forEach((areaId, i) => {
      const a = areas[areaId] || {};
      const dicht = !!KR_STATE.ui.collapsedAreas[areaId];
      rijen.push({ type:'area', areaId, name:a.name || areaId, order:a.order || '', dicht, eerste:i === 0 });
      if (dicht) return;
      koersSubgroepen({ [areaId]: a }).forEach(sub => {
        rijen.push({ type:'sub', areaId, sgId:sub.id, name:sub.name,
                     diepte:Math.max(0, sub.pad.length - 1), leaf:sub.leaf });
      });
    });
  return rijen;
}

// ─── Doelen naar cellen ─────────────────────────
// Bezette maandreeks van één doel: alles wat getekend wordt, dus inclusief
// een stempel ná de doelmaand en de prioriteitspijl in de kolom erna.
function krSpan(goal) {
  if (!goal) return null;
  const cel = koersCellen(goal, KR_VANDAAG);
  const s = {
    goal, cel,
    groenVan: cel.groen ? maandNr(cel.groen[0]) : null,
    groenTot: cel.groen ? maandNr(cel.groen[1]) : null,
    stempel: cel.stempel ? maandNr(cel.stempel.maand) : null,
    verlaten: cel.verlaten ? maandNr(cel.verlaten) : null
  };
  const nrs = [s.groenVan, s.groenTot, s.stempel, s.verlaten].filter(n => n != null);
  if (!nrs.length) return null;
  s.van = Math.min.apply(null, nrs);
  s.tot = Math.max.apply(null, nrs);
  s.totMetPijl = s.tot + (goal.isPriority ? 1 : 0);
  return s;
}

// Banen: het eerste spoor waarin dit doel niet botst. Zonder dit verbergt
// de bovenste balk de onderste volledig, inclusief de klik.
// Zet ook vrijTot — tot waar de titel naast het doel mag doorlopen.
function krBanen(spans) {
  const bezetTot = [], laatste = [];
  spans.forEach(s => {
    let b = bezetTot.findIndex(t => t < s.van);
    if (b === -1) { b = bezetTot.length; bezetTot.push(-Infinity); }
    bezetTot[b] = s.totMetPijl;
    if (laatste[b]) laatste[b].vrijTot = s.van - 1;
    laatste[b] = s;
    s.baan = b;
  });
  laatste.forEach(s => { if (s.vrijTot == null) s.vrijTot = Infinity; });
  return Math.max(1, bezetTot.length);
}

// Alle doelen gegroepeerd per subgroep, met banen toegewezen.
function krDoelenPerSub() {
  const per = {};
  objToArr(KR_STATE.data.goals).forEach(g => {
    const s = krSpan(g);
    if (!s) return;
    (per[g.subgroupId] = per[g.subgroupId] || []).push(s);
  });
  Object.keys(per).forEach(sg => {
    per[sg].sort((a, b) => a.van - b.van || a.tot - b.tot);
    per[sg].banen = krBanen(per[sg]);
  });
  return per;
}

// Knipt een maandreeks in kwartaalstukken. Een reeks die halverwege een
// kwartaal begint of eindigt levert een kort stuk op — dat is bedoeld.
function krKwartaalStukken(van, tot) {
  const stukken = [];
  let nr = van;
  while (nr <= tot) {
    const eindKw = nr - ((nr % 12) % 3) + 2;
    stukken.push([nr, Math.min(eindKw, tot)]);
    nr = eindKw + 1;
  }
  return stukken;
}

function krRijHoogte(rij, per, m) {
  if (rij.type === 'area') return m.rowarea;
  if (!rij.leaf) return m.rowsub;
  const banen = (per[rij.sgId] && per[rij.sgId].banen) || 1;
  return 2 * m.pad + banen * m.bar + (banen - 1) * m.gap;
}

// Samenvatting van een ingeklapt gebied
function krRollup(areaId, per) {
  const area = KR_STATE.data.areas[areaId];
  if (!area) return null;
  let van = null, tot = null, aantal = 0, prio = 0;
  koersLeafSubgroepen({ [areaId]: area }).forEach(sub => {
    (per[sub.id] || []).forEach(s => {
      aantal++;
      if (s.goal.isPriority) prio++;
      if (van == null || s.van < van) van = s.van;
      if (tot == null || s.tot > tot) tot = s.tot;
    });
  });
  return aantal ? { van, tot, aantal, prio } : null;
}

// ─── Tekenen ────────────────────────────────────
function renderRaster() {
  const grid = document.getElementById('kr-grid');
  const scroll = document.getElementById('kr-scroll');
  const sl = scroll.scrollLeft, st = scroll.scrollTop;

  const m = krMaten();
  const as = krAs();
  const rijen = krRijen();
  const per = krDoelenPerSub();
  const kol = nr => 2 + (nr - as.van);

  let html = krKopHtml(as);
  const hoogtes = [];
  rijen.forEach((rij, i) => {
    const rijNr = 4 + i;
    hoogtes.push(krRijHoogte(rij, per, m));
    html += krLinkerCel(rij, rijNr);
    html += krRijAchtergrond(rij, rijNr);
    if (rij.type === 'area') {
      if (rij.dicht) {
        const r = krRollup(rij.areaId, per);
        if (r) {
          const van = Math.max(r.van, as.van), tot = Math.min(r.tot, as.tot);
          if (tot >= van) {
            html += `<div class="kr-rollup" style="grid-row:${rijNr};grid-column:${kol(van)}/span ${tot - van + 1}">`
                  + `${r.aantal} ${r.aantal === 1 ? 'doel' : 'doelen'}${r.prio ? ' · ' + r.prio + ' ▸' : ''}</div>`;
          }
        }
      }
      return;
    }
    if (!rij.leaf) return;
    (per[rij.sgId] || []).forEach(s => { html += krDoelHtml(s, rijNr, as, m); });
  });

  if (!rijen.length) {
    hoogtes.push(m.rowsub * 2);
    html += `<div class="kr-leeg" style="grid-row:4">`
          + (KR_STATE.ui.melding ? 'Geen indeling geladen.' : 'Nog geen gebieden.') + `</div>`;
  }

  html += krVandaagLijn(as);

  grid.style.gridTemplateColumns = `var(--kr-left) repeat(${as.n}, var(--kr-col)) var(--kr-col)`;
  grid.style.gridTemplateRows = ['var(--kr-h1)', 'var(--kr-h2)', 'var(--kr-h3)']
    .concat(hoogtes.map(h => h + 'px')).join(' ');
  grid.innerHTML = html;

  scroll.scrollLeft = sl; scroll.scrollTop = st;
  if (!KR_STATE.ui.naarVandaagGedaan && rijen.length) krScrollNaarVandaag();
}

function krKopHtml(as) {
  let h = `<div class="kr-hoek">Gebieden</div>`;
  const jVan = Math.floor(as.van / 12), jTot = Math.floor(as.tot / 12);
  for (let j = jVan; j <= jTot; j++) {
    const k = 2 + (j * 12 - as.van);
    h += `<div class="kr-jaar${j > jVan ? ' kr-jgrens' : ''}" style="grid-row:1;grid-column:${k}/span 12"><span>${j}</span></div>`;
    for (let q = 0; q < 4; q++) {
      h += `<div class="kr-kw" style="grid-row:2;grid-column:${k + q * 3}/span 3">Q${q + 1}</div>`;
    }
    for (let mn = 0; mn < 12; mn++) {
      const nr = j * 12 + mn;
      h += `<div class="kr-mnd${nr === as.nu ? ' kr-nu' : ''}" style="grid-row:3;grid-column:${k + mn}">${KR_MND[mn]}</div>`;
    }
  }
  return h;
}

function krLinkerCel(rij, rijNr) {
  if (rij.type === 'area') {
    const chev = rij.dicht ? '▸' : '▾';
    return `<div class="kr-l kr-l-area${rij.eerste ? '' : ' kr-grens'}" style="grid-row:${rijNr}"`
         + ` data-action="toggleArea" data-area="${esc(rij.areaId)}" title="In- of uitklappen">`
         + `<span class="chev">${chev}</span>`
         + `<span class="kr-l-naam"><span class="nr">${esc(String(rij.order))}</span> ${esc(rij.name)}</span></div>`;
  }
  return `<div class="kr-l kr-l-sub${rij.leaf ? '' : ' kr-tak'}"`
       + ` style="grid-row:${rijNr};padding-left:${10 + rij.diepte * 14}px">`
       + `<span class="kr-l-naam">${esc(rij.name)}</span></div>`;
}

function krRijAchtergrond(rij, rijNr) {
  if (rij.type === 'area') {
    return `<div class="kr-rij kr-rij-area${rij.eerste ? '' : ' kr-grens'}" style="grid-row:${rijNr}"`
         + ` data-action="toggleArea" data-area="${esc(rij.areaId)}"></div>`;
  }
  // Alleen bladeren zijn aanklikbaar: doelen hangen niet aan een tussenlaag
  return `<div class="kr-rij" style="grid-row:${rijNr}"`
       + (rij.leaf ? ` data-action="nieuwInCel" data-sg="${esc(rij.sgId)}"` : '') + `></div>`;
}

// Eén doel: groene aanloop (of de doorlopende balk), de stempel, de
// verlaten maand, de prioriteitspijl en — als het niet in de balk past —
// de titel in de vrije kolommen erna.
function krDoelHtml(s, rijNr, as, m) {
  const g = s.goal, cel = s.cel;
  const kol = nr => 2 + (nr - as.van);
  const zicht = nr => nr != null && nr >= as.van && nr <= as.tot;
  const top = m.pad + s.baan * (m.bar + m.gap);
  const basis = `grid-row:${rijNr};align-self:start;margin-top:${top}px;height:${m.bar}px`;
  const titel = esc(g.title || '(zonder titel)');
  const klik = ` data-action="openDoel" data-id="${esc(g.id)}" title="${titel}"`;
  let h = '', titelIn = false;

  if (s.groenVan != null && s.groenTot != null && s.groenTot >= s.groenVan) {
    const van = Math.max(s.groenVan, as.van), tot = Math.min(s.groenTot, as.tot);
    if (tot >= van) {
      // Geen stempel (doorlopend) maar wel prioriteit? Dan krijgt de balk de rand
      const prioBar = (!zicht(s.stempel) && g.isPriority) ? ' kr-prio' : '';
      if (cel.doorlopend) {
        // Eén blok per kwartaal: doorlopend werk vink je per kwartaal af,
        // dus het is geen balk die naar het niets vervaagt.
        const stukken = krKwartaalStukken(van, tot);
        titelIn = (stukken[0][1] - stukken[0][0] + 1) >= 3;
        stukken.forEach((st, i) => {
          // De prioriteitsrand hoort één keer om het doel, niet om elk kwartaal
          h += `<div class="kr-bar kr-door${i === 0 ? prioBar : ''}"`
             + ` style="${basis};grid-column:${kol(st[0])}/span ${st[1] - st[0] + 1}"${klik}>`
             + (i === 0 && titelIn ? `<span class="kr-lbl">${titel}</span>` : '') + `</div>`;
        });
      } else {
        const breed = tot - van + 1;
        titelIn = breed >= 3;
        const soort = 'kr-groen' + (s.stempel === s.groenTot + 1 ? ' kr-half' : '') + prioBar;
        h += `<div class="kr-bar ${soort}" style="${basis};grid-column:${kol(van)}/span ${breed}"${klik}>`
           + (titelIn ? `<span class="kr-lbl">${titel}</span>` : '') + `</div>`;
      }
    }
  }

  if (zicht(s.stempel)) {
    const rand = (cel.stempel.rand === 'rood' ? ' kr-open' : '');
    const prio = (g.isPriority ? ' kr-prio' : '');
    h += `<div class="kr-bar kr-stempel kr-k-${esc(cel.stempel.kleur)}${prio}${rand}"`
       + ` style="${basis};grid-column:${kol(s.stempel)}/span 1"${klik}></div>`;
  }

  if (zicht(s.verlaten)) {
    h += `<div class="kr-verlaten" style="${basis};grid-column:${kol(s.verlaten)}/span 1"`
       + ` data-action="openDoel" data-id="${esc(g.id)}" title="Geplande maand die niet leverde"></div>`;
  }

  if (g.isPriority && s.tot + 1 <= as.tot + 1) {
    h += `<div class="kr-pijl" style="${basis};grid-column:${kol(s.tot + 1)}/span 1">${KR_PIJL}</div>`;
  }

  if (!titelIn) {
    const start = s.tot + 1 + (g.isPriority ? 1 : 0);
    const eind = Math.min(s.vrijTot == null || s.vrijTot === Infinity ? as.tot : s.vrijTot, as.tot);
    // Eén kolom (34px) leest als een fout; dan liever niets — de balk heeft een tooltip
    if (eind - start >= 1) {
      h += `<div class="kr-titel" style="${basis};grid-column:${kol(start)}/span ${eind - start + 1}">`
         + `<span class="kr-lbl">${titel}</span></div>`;
    }
  }
  return h;
}

function krVandaagLijn(as) {
  const d = KR_VANDAAG;
  const dagen = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  const x = (as.nu - as.van) + (d.getDate() - 1) / dagen;
  return `<div class="kr-nu-lijn" style="left:calc(var(--kr-left) + var(--kr-col) * ${x.toFixed(3)});`
       + `top:calc(var(--kr-h1) + var(--kr-h2) + var(--kr-h3));bottom:0"></div>`;
}

function krScrollNaarVandaag(force) {
  const scroll = document.getElementById('kr-scroll');
  const m = krMaten(), as = krAs();
  scroll.scrollLeft = Math.max(0, (as.nu - as.van - 2) * m.col);
  if (!force) KR_STATE.ui.naarVandaagGedaan = true;
}

// ─── Legenda ────────────────────────────────────
// Uit het model, plus de twee dingen die geen status zijn: de groene aanloop
// en de prioriteitspijl. 'Verschoven / uitgelopen' dekt de grijze cel al —
// die staat er bij een uitgelopen doel om dezelfde reden.
function renderLegenda() {
  const item = (klass, label) => `<span class="kr-leg"><span class="kr-swatch ${klass}"></span>${esc(label)}</span>`;
  let h = item('kr-groen', 'Voorbereiding');
  Object.keys(KOERS_STATUS).forEach(k => {
    const st = KOERS_STATUS[k];
    h += item('kr-k-' + st.kleur + (k === 'doorlopend' ? ' kr-door' : ''), st.label);
  });
  h += item('kr-k-' + KOERS_BESLISSING_OPEN.kleur + ' kr-open', KOERS_BESLISSING_OPEN.label);
  h += `<span class="kr-leg">${KR_PIJL}Prioriteit</span>`;
  return h;
}

// ─── Doelen ─────────────────────────────────────
// Labels en opties. De subgroep-optie zet de gebiedsnaam vooraan, want drie
// bladeren heten allemaal 'Ongoing'.
function krMaandLabel(m) {
  const nr = maandNr(m);
  return nr == null ? '—' : KR_MND[nr % 12] + ' ' + Math.floor(nr / 12);
}

function krMaandOpties(sel) {
  const as = krAs();
  let van = as.van - 12, tot = as.tot + 12;
  const s = maandNr(sel);
  if (s != null) { van = Math.min(van, s); tot = Math.max(tot, s); }
  let h = '';
  for (let nr = van; nr <= tot; nr++) {
    const m = nrNaarMaand(nr);
    h += `<option value="${m}"${m === sel ? ' selected' : ''}>${krMaandLabel(m)}</option>`;
  }
  return h;
}

function krLeafOpties(sel) {
  const areas = KR_STATE.data.areas;
  let h = `<option value="">— Kies —</option>`;
  Object.keys(areas)
    .sort((a, b) => (areas[a].order || 0) - (areas[b].order || 0))
    .forEach(aid => {
      koersLeafSubgroepen({ [aid]: areas[aid] }).forEach(sub => {
        const label = (areas[aid].name || aid) + ' › ' + sub.pad.join(' › ');
        h += `<option value="${esc(sub.id)}"${sub.id === sel ? ' selected' : ''}>${esc(label)}</option>`;
      });
    });
  return h;
}

function krPadVan(sgId) {
  const areas = KR_STATE.data.areas;
  for (const aid of Object.keys(areas)) {
    const sub = koersSubgroepen({ [aid]: areas[aid] }).find(s => s.id === sgId);
    if (sub) return (areas[aid].name || aid) + ' › ' + sub.pad.join(' › ');
  }
  return 'onbekende subgroep';
}

function krNieuwDoel(opts) {
  const o = opts || {};
  const maand = o.maand || huidigeMaand(KR_VANDAAG);
  KR_STATE.ui.modal = 'doel';
  KR_STATE.ui.modalData = { isNew: true, subgroupId: o.subgroupId || '', title: o.titel || '',
    startMonth: maand, endMonth: maand, status: 'gepland', completedAt: '', isPriority: false };
  KR_STATE.ui.modalExtra = null;
  KR_STATE.ui.modalDirty = false;
  KR_STATE.ui.headerMenu = false;
  renderModal();
}

function krOpenDoel(id) {
  const g = KR_STATE.data.goals[id];
  if (!g) return;
  KR_STATE.ui.modal = 'doel';
  KR_STATE.ui.modalData = Object.assign({}, g, { id });
  KR_STATE.ui.modalExtra = null;
  KR_STATE.ui.modalDirty = false;
  renderModal();
}

function renderDoelModal(c) {
  const d = KR_STATE.ui.modalData;
  if (!d) return '';
  const mist = v => !v || !String(v).trim();
  const lab = (txt, fout) => `<label${fout ? ` style="color:${c.rood}"` : ''}>${txt}${fout ? ' *' : ''}</label>`;
  const rand = fout => fout ? ` style="border-color:${c.rood}"` : '';
  const status = d.status || 'gepland';
  const doorlopend = status === 'doorlopend';
  const startNr = maandNr(d.startMonth), eindNr = maandNr(d.endMonth);
  const startFout = startNr != null && eindNr != null && startNr > eindNr;

  return `
    <div class="field">${lab('Subgroep', mist(d.subgroupId))}
      <select onchange="KR.mf('subgroupId',this.value)"${rand(mist(d.subgroupId))}>${krLeafOpties(d.subgroupId)}</select></div>
    <div class="field">${lab('Titel', mist(d.title))}
      <input value="${esc(d.title || '')}" oninput="KR.mf('title',this.value)"${rand(mist(d.title))}></div>
    <div class="kr-veldrij">
      <div class="field">${lab(doorlopend ? 'Vanaf' : 'Voorbereiding vanaf', startFout)}
        <select onchange="KR.mf('startMonth',this.value)"${rand(startFout)}>${krMaandOpties(d.startMonth)}</select></div>
      <div class="field">${lab(doorlopend ? 'Tot en met' : 'Doelmaand', mist(d.endMonth))}
        <select onchange="KR.mf('endMonth',this.value)"${rand(mist(d.endMonth))}>${krMaandOpties(d.endMonth)}</select></div>
    </div>
    <p class="kr-hint">${startFout ? `<span style="color:${c.rood}">De start ligt na de doelmaand.</span> ` : ''}${doorlopend
      ? 'Doorlopend werk staat als een blok per kwartaal.'
      : 'Staat de voorbereiding op dezelfde maand als het doel, dan is er geen aanloop — alleen de stempel.'}</p>
    <div class="field"><label>Status</label>
      <select onchange="KR.mf('status',this.value)">
        ${Object.keys(KOERS_STATUS).map(k =>
          `<option value="${k}"${status === k ? ' selected' : ''}>${esc(KOERS_STATUS[k].label)}</option>`).join('')}
      </select></div>
    ${status === 'gehaald' ? `<div class="field"><label>Gehaald in</label>
      <select onchange="KR.mf('completedAt',this.value)">${krMaandOpties(d.completedAt || d.endMonth)}</select></div>
      <p class="kr-hint">De maand waarin het doel écht af was. Ligt die na de doelmaand, dan blijft
       de geplande maand grijs staan als de maand die niet leverde.</p>` : ''}
    <div class="kr-cb-rij" data-action="toggleDoelPrio">
      <div class="cb ${d.isPriority ? 'checked' : ''}">${d.isPriority ? '✓' : ''}</div>
      <span>Prioriteit</span></div>
    <div style="display:flex;justify-content:${d.isNew ? 'flex-end' : 'space-between'};margin-top:14px">
      ${d.isNew ? '' : `<button class="btn btn-red" style="font-size:11px" data-action="verwijderDoel" data-id="${esc(d.id)}">Verwijder</button>`}
      <button class="btn btn-black" data-action="bewaarDoel">Klaar</button>
    </div>`;
}

function krBewaarDoel() {
  const d = KR_STATE.ui.modalData;
  if (!d) return;
  if (!d.subgroupId) { showToast('Kies een subgroep'); return; }
  if (!d.title || !d.title.trim()) { showToast('Geef het doel een titel'); return; }
  if (!d.endMonth) { showToast('Kies een doelmaand'); return; }
  const eindNr = maandNr(d.endMonth), startNr = maandNr(d.startMonth);
  const status = d.status || 'gepland';
  const rec = {
    subgroupId: d.subgroupId,
    title: d.title.trim(),
    // Een start ná de doelmaand bestaat niet; dan is er simpelweg geen aanloop
    startMonth: (startNr != null && startNr <= eindNr) ? d.startMonth : d.endMonth,
    endMonth: d.endMonth,
    status,
    completedAt: status === 'gehaald' ? (d.completedAt || d.endMonth) : null,
    isPriority: !!d.isPriority,
    updatedAt: today()
  };
  const nieuw = !!d.isNew, dirty = KR_STATE.ui.modalDirty;
  if (nieuw) { rec.createdAt = today(); fbPush('koers/goals', rec); }
  else fbUpdate('koers/goals/' + d.id, rec);
  KR_STATE.ui.modalDirty = false;
  KR_STATE.ui.modal = null; KR_STATE.ui.modalData = null; KR_STATE.ui.modalExtra = null;
  renderModal();
  if (nieuw) showToast('Doel toegevoegd');
  else if (dirty) showToast('Opgeslagen');
}

// Een doel heeft geen koppelingen, dus geen impact-dialoog — wel een undo,
// want de hele kopie zit al in het geheugen.
function krVerwijderDoel(id) {
  const g = KR_STATE.data.goals[id];
  if (!g) return;
  const kopie = JSON.parse(JSON.stringify(g));
  showConfirm(`Doel "${g.title || ''}" verwijderen?`, () => {
    KR_STATE.ui.modalDirty = false;
    KR_STATE.ui.modal = null; KR_STATE.ui.modalData = null; KR_STATE.ui.modalExtra = null;
    renderModal();
    fbRemove('koers/goals/' + id);
    showToast('Doel verwijderd', () => fbSet('koers/goals/' + id, kopie));
  }, { yes: 'Verwijder' });
}

// ─── Open beslissingen ──────────────────────────
// De doelmaand is voorbij en er is niets gekozen. Dat is bewust tijdelijk:
// het alarm hoort weg bij de eerstvolgende review.
function krOpenBeslissingen() {
  return objToArr(KR_STATE.data.goals)
    .filter(g => koersStatus(g, KR_VANDAAG) === 'beslissing-open')
    .sort((a, b) => (maandNr(a.endMonth) || 0) - (maandNr(b.endMonth) || 0));
}

function krOpenBeslissingenModal() {
  KR_STATE.ui.modal = 'beslissingen';
  KR_STATE.ui.modalData = null;
  KR_STATE.ui.modalExtra = null;
  KR_STATE.ui.modalDirty = false;
  KR_STATE.ui.headerMenu = false;
  renderModal();
}

function renderBeslissingenModal(c) {
  const lijst = krOpenBeslissingen();
  if (!lijst.length) {
    return `<p style="font-size:13px;font-weight:300;line-height:1.6">Niets open. Elke doelmaand
      die voorbij is, is afgehandeld.</p>`;
  }
  const nu = huidigeMaand(KR_VANDAAG);
  return `<p class="kr-hint" style="margin-top:0">Deze doelen hadden hun doelmaand moeten halen.
      Kies per doel wat er gebeurd is; zolang je niet kiest, staat de cel geel met een rode rand.</p>
    <table class="kr-bes"><thead><tr>
      <th>Doel</th><th>Doelmaand</th><th>Gehaald in</th><th></th>
    </tr></thead><tbody>
    ${lijst.map(g => `<tr>
        <td><div>${esc(g.title || '(zonder titel)')}</div>
            <div class="kr-pad">${esc(krPadVan(g.subgroupId))}</div></td>
        <td>${krMaandLabel(g.endMonth)}</td>
        <td><select data-bm="${esc(g.id)}">${krMaandOpties(nu)}</select></td>
        <td class="kr-bes-knoppen">
          <button class="btn btn-xs btn-black" data-action="beslisGehaald" data-id="${esc(g.id)}">Gehaald</button>
          <button class="btn btn-xs btn-grey" data-action="beslisBijgesteld" data-id="${esc(g.id)}">Bijgesteld</button>
          <button class="btn btn-xs btn-grey" data-action="beslisVerschoven" data-id="${esc(g.id)}">Verschoven</button>
        </td></tr>`).join('')}
    </tbody></table>`;
}

function krZetStatus(id, status, completedAt) {
  const g = KR_STATE.data.goals[id];
  if (!g) return;
  const rec = { status, updatedAt: today(),
                completedAt: status === 'gehaald' ? (completedAt || huidigeMaand(KR_VANDAAG)) : null };
  fbUpdate('koers/goals/' + id, rec);
  // Meteen lokaal bijwerken, zodat de lijst niet op Firebase wacht
  Object.assign(g, rec);
  renderModal();
  if (status === 'verschoven') {
    // Het stempel blijft op de oude plek staan; het werk zelf wordt een nieuw doel
    showConfirm(`"${g.title || 'Dit doel'}" staat nu als verschoven. Het werk zelf wordt een nieuw doel — nu aanmaken?`,
      () => krNieuwDoel({ subgroupId: g.subgroupId, titel: g.title, maand: huidigeMaand(KR_VANDAAG) }),
      { yes: 'Nieuw doel', no: 'Niet nu' });
  } else {
    showToast(status === 'gehaald' ? 'Doel gehaald' : 'Doel bijgesteld');
  }
}

// ─── Modals ─────────────────────────────────────
// Zelfde machinerie als Koppelbaas: één renderModal() met een switch, een
// overlay die alleen sluit als muis én klik erop landden, en velden die
// rechtstreeks in de buffer schrijven zonder te hertekenen.
let _krConfirmCb = null;
let _krConfirmPrev = null;

function showConfirm(msg, onYes, labels) {
  _krConfirmPrev = { modal: KR_STATE.ui.modal, modalData: KR_STATE.ui.modalData,
                     modalExtra: KR_STATE.ui.modalExtra, dirty: KR_STATE.ui.modalDirty };
  _krConfirmCb = onYes;
  KR_STATE.ui.modal = 'sysConfirm';
  KR_STATE.ui.modalData = { confirmMsg: msg, confirmYes: labels && labels.yes, confirmNo: labels && labels.no };
  KR_STATE.ui.modalExtra = null;
  KR_STATE.ui.modalDirty = false;
  renderModal();
}

// Terug naar waar de bevestiging vandaan kwam
function krConfirmTerug() {
  _krConfirmCb = null;
  const p = _krConfirmPrev;
  _krConfirmPrev = null;
  if (p) {
    KR_STATE.ui.modal = p.modal; KR_STATE.ui.modalData = p.modalData;
    KR_STATE.ui.modalExtra = p.modalExtra; KR_STATE.ui.modalDirty = p.dirty;
  } else {
    KR_STATE.ui.modal = null; KR_STATE.ui.modalData = null;
    KR_STATE.ui.modalExtra = null; KR_STATE.ui.modalDirty = false;
  }
  renderModal();
}

function renderModal() {
  const mc = document.getElementById('kr-modal');
  const modal = KR_STATE.ui.modal;
  if (!modal) { mc.innerHTML = ''; return; }
  const c = C();
  let w = 460, title = '', body = '';

  switch (modal) {
    case 'doel':
      title = (KR_STATE.ui.modalData || {}).isNew ? 'Nieuw doel' : 'Doel';
      body = renderDoelModal(c); break;
    case 'beslissingen':
      w = 640; title = 'Open beslissingen'; body = renderBeslissingenModal(c); break;
    case 'sysConfirm': {
      w = 380; title = 'Bevestigen';
      const d = KR_STATE.ui.modalData || {};
      body = `<p style="font-size:13px;font-weight:300;line-height:1.5;margin-bottom:14px">${esc(d.confirmMsg || '')}</p>
        <div style="display:flex;justify-content:flex-end;gap:6px">
          <button class="btn btn-grey" data-action="sysConfirmNo">${esc(d.confirmNo || 'Annuleer')}</button>
          <button class="btn btn-black" data-action="sysConfirmYes">${esc(d.confirmYes || 'Ja')}</button>
        </div>`;
      break;
    }
  }

  let html = `<div class="modal-overlay" onmousedown="this._mdTarget=event.target"`
    + ` onclick="if(event.target===this&&this._mdTarget===this)KR.closeModal()" data-action="modalBody">`
    + `<div class="modal" style="max-width:${w}px" data-action="modalBody">`
    + `<div class="modal-head"><h3>${title}</h3>`
    + `<button class="btn-icon" style="font-size:18px" data-action="closeModal">✕</button></div>`
    + `<div class="modal-body">${body}</div></div></div>`;

  const mb = mc.querySelector('.modal-body');
  const st = mb ? mb.scrollTop : 0;
  mc.innerHTML = html;
  const mb2 = mc.querySelector('.modal-body');
  if (mb2 && st) mb2.scrollTop = st;
}

KR.closeModal = function() {
  const sluit = () => {
    KR_STATE.ui.modal = null; KR_STATE.ui.modalData = null; KR_STATE.ui.modalExtra = null;
    renderModal();
  };
  if (KR_STATE.ui.modalDirty) {
    showConfirm('Wijzigingen niet opgeslagen. Toch sluiten?', () => {
      KR_STATE.ui.modalDirty = false; sluit();
    });
    return;
  }
  sluit();
};

// Velden schrijven rechtstreeks in de buffer en hertekenen niet — anders
// verlies je je cursor of klapt op mobiel het toetsenbord dicht. Alleen wat
// de vórm van het formulier verandert hertekent.
KR.mf = function(field, value) {
  const d = KR_STATE.ui.modalData;
  if (!d) return;
  d[field] = value;
  if (KR_STATE.ui.modal !== 'sysConfirm') KR_STATE.ui.modalDirty = true;
  if (field === 'status' || field === 'isPriority' || field === 'startMonth' || field === 'endMonth') renderModal();
};

// ─── Schil ──────────────────────────────────────
function renderHeader(c) {
  const open = krOpenBeslissingen().length;
  const zwart = KR_STATE.ui.dark ? '#444' : '#000';
  return `<div class="header">
    ${renderBrand('STRATEGIE', 'Koers')}
    <div class="header-right">
      <button data-noprint title="Open beslissingen" class="btn header-btn"
        style="background:${open ? c.rood : zwart}" data-action="showBeslissingen">
        <span class="header-icon">${ico('alert',18)}</span> ${open}</button>
      <button data-noprint title="Nieuw doel" class="btn header-btn" style="background:${zwart}"
        data-action="nieuwDoel"><span class="header-icon" style="font-size:18px;line-height:1">+</span>
        <span class="kr-btn-lang">Nieuw doel</span></button>
      <div data-noprint>
        ${renderHeaderMenu({ dark: KR_STATE.ui.dark, menuOpen: KR_STATE.ui.headerMenu, c })}
      </div>
    </div>
  </div>` + renderAppSwitcher('koers') + renderToolbar();
}

function renderToolbar() {
  const goals = objToArr(KR_STATE.data.goals);
  const open = goals.filter(g => koersStatus(g, KR_VANDAAG) === 'beslissing-open').length;
  return `<div class="kr-toolbar" data-noprint>
    <button class="btn btn-xs btn-grey" data-action="allesUit">Alles uit</button>
    <button class="btn btn-xs btn-grey" data-action="allesIn">Alles in</button>
    <button class="btn btn-xs btn-grey" data-action="naarVandaag">← Vandaag</button>
    <span class="kr-toolbar-stat">${goals.length} ${goals.length === 1 ? 'doel' : 'doelen'}`
    + (open ? ` · <span style="color:var(--rood)">${open} open beslissing${open === 1 ? '' : 'en'}</span>` : '')
    + `</span>
  </div>`;
}

function render() {
  document.getElementById('shell').innerHTML = renderHeader(C());
  renderRaster();
  document.getElementById('kr-legenda').innerHTML = renderLegenda();
  const mld = document.getElementById('kr-melding');
  mld.textContent = KR_STATE.ui.melding;
  mld.classList.toggle('zicht', !!KR_STATE.ui.melding);
  // Typ je in de modal, dan blijft die staan: een Firebase-update mag je
  // cursor niet slopen (en op mobiel niet het toetsenbord dichtklappen).
  const ae = document.activeElement;
  if (!(ae && ae.closest('.modal-body'))) renderModal();
}

// Alles wat van buiten komt (drie Firebase-listeners) gaat hierlangs, zodat
// gelijktijdige updates één render geven in plaats van drie.
let _krRaf = null;
function renderVeilig() {
  if (_krRaf) return;
  _krRaf = requestAnimationFrame(() => { _krRaf = null; render(); });
}

function setupEventListeners() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    const action = el ? el.dataset.action : null;

    // Klik buiten het menu sluit het
    if (KR_STATE.ui.headerMenu && action !== 'toggleHeaderMenu') { KR_STATE.ui.headerMenu = false; render(); }
    if (!action) return;

    switch(action) {
      case 'toggleHeaderMenu':
        KR_STATE.ui.headerMenu = !KR_STATE.ui.headerMenu; render(); break;
      case 'toggleDark':
        KR_STATE.ui.dark = !KR_STATE.ui.dark; KR_STATE.ui.headerMenu = false;
        themeSetDark(KR_STATE.ui.dark);
        applyTheme(); render(); break;
      case 'print':
        KR_STATE.ui.headerMenu = false; render(); setTimeout(() => window.print(), 100); break;
      case 'gotoApps':
        window.location.href = 'index.html'; break;
      case 'logout':
        logout(); break;
      case 'toggleArea':
        krZetInklap(el.dataset.area); break;
      case 'allesIn':
        KR_STATE.ui.collapsedAreas = {}; render(); break;
      case 'allesUit':
        Object.keys(KR_STATE.data.areas).forEach(id => { KR_STATE.ui.collapsedAreas[id] = true; });
        render(); break;
      case 'naarVandaag':
        krScrollNaarVandaag(true); break;

      // ─── Doelen ───
      case 'nieuwDoel':
        krNieuwDoel(); break;
      case 'nieuwInCel': {
        // Welke maand is aangeklikt? De kolombreedte staat in CSS, dus meten
        const m = krMaten(), as = krAs();
        const r = el.getBoundingClientRect();
        const idx = Math.floor((e.clientX - r.left) / m.col);
        const nr = as.van + Math.max(0, Math.min(as.n - 1, idx));
        krNieuwDoel({ subgroupId: el.dataset.sg, maand: nrNaarMaand(nr) });
        break;
      }
      case 'openDoel':
        krOpenDoel(el.dataset.id); break;
      case 'bewaarDoel':
        krBewaarDoel(); break;
      case 'verwijderDoel':
        krVerwijderDoel(el.dataset.id); break;
      case 'toggleDoelPrio':
        KR.mf('isPriority', !(KR_STATE.ui.modalData || {}).isPriority); break;

      // ─── Open beslissingen ───
      case 'showBeslissingen':
        krOpenBeslissingenModal(); break;
      case 'beslisGehaald': {
        const sel = document.querySelector(`select[data-bm="${el.dataset.id}"]`);
        krZetStatus(el.dataset.id, 'gehaald', sel ? sel.value : null);
        break;
      }
      case 'beslisBijgesteld':
        krZetStatus(el.dataset.id, 'bijgesteld'); break;
      case 'beslisVerschoven':
        krZetStatus(el.dataset.id, 'verschoven'); break;

      // ─── Modals ───
      case 'closeModal':
        KR.closeModal(); break;
      case 'sysConfirmYes':
        if (_krConfirmCb) { const cb = _krConfirmCb; _krConfirmCb = null; _krConfirmPrev = null; cb(); }
        break;
      case 'sysConfirmNo':
        krConfirmTerug(); break;
      case 'modalBody':
        break;
    }
  });

  // Escape sluit de modal; een bevestiging valt terug naar waar hij vandaan kwam
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape' || !KR_STATE.ui.modal) return;
    if (KR_STATE.ui.modal === 'sysConfirm') krConfirmTerug();
    else KR.closeModal();
  });

  window.addEventListener('resize', renderVeilig);
}

function krZetInklap(areaId) {
  if (!areaId) return;
  if (KR_STATE.ui.collapsedAreas[areaId]) delete KR_STATE.ui.collapsedAreas[areaId];
  else KR_STATE.ui.collapsedAreas[areaId] = true;
  render();
}

// ─── Data ───────────────────────────────────────
// Staat er nog geen indeling, dan komt die uit shared/koers-model.js.
// Verder niets: de indeling ligt vast, dus een lege /koers/areas is het
// enige geval waarin er iets te schrijven valt.
async function seedIndienNodig() {
  const snap = await db.ref('koers/areas').once('value');
  if (snap.val()) return false;
  await fbSet('koers/areas', KOERS_AREAS_DEFAULT);
  return true;
}

function luisterNaarData() {
  db.ref('koers/areas').on('value', snap => {
    KR_STATE.data.areas = snap.val() || {};
    renderVeilig();
  });
  db.ref('koers/goals').on('value', snap => {
    KR_STATE.data.goals = snap.val() || {};
    renderVeilig();
  });
}

(function init() {
  requireAuth(async () => {
    document.getElementById('app').style.display = 'flex';
    applyTheme();
    render();
    setupEventListeners();

    try {
      if (await seedIndienNodig()) showToast('Indeling aangemaakt');
      luisterNaarData();
    } catch (e) {
      console.error('Koers-data:', e);
      KR_STATE.ui.melding = (e && e.code === 'PERMISSION_DENIED')
        ? 'Geen toegang tot /koers. Staat de koers-regel al in de Firebase-rules?'
        : 'Kon de indeling niet laden: ' + (e.message || e);
      render();
    }
  });
})();
  </script>
</body>
</html>
